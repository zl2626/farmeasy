name: Deploy FarmEasy frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: farmeasy-frontend/package-lock.json

      - name: Install dependencies
        working-directory: farmeasy-frontend
        run: npm ci --legacy-peer-deps

      - name: Build site
        working-directory: farmeasy-frontend
        env:
          VITE_BASE_PATH: /farmeasy/
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_MEDIA_ORIGIN: ${{ vars.VITE_MEDIA_ORIGIN }}
        run: |
          if [[ "$VITE_API_BASE_URL" != https://* ]]; then
            echo "Set repository variable VITE_API_BASE_URL to your deployed HTTPS backend URL ending in /api."
            exit 1
          fi
          npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: farmeasy-frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
