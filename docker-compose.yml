services:
  backend:
    build: ./backend
    environment:
      DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY:?请先设置 DJANGO_SECRET_KEY}"
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,backend"
      CORS_ALLOWED_ORIGINS: "http://localhost:8080"
      CSRF_TRUSTED_ORIGINS: "http://localhost:8080"
      FRONTEND_URL: "http://localhost:8080"
      DJANGO_SECURE_SSL_REDIRECT: "false"
      DJANGO_DB_PATH: "/app/runtime/db.sqlite3"
    volumes:
      - backend_data:/app/runtime
      - backend_media:/app/media
    restart: unless-stopped

  frontend:
    build: ./farmeasy-frontend
    depends_on:
      - backend
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  backend_data:
  backend_media:
